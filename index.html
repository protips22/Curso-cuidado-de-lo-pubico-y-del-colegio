const M=[
{t:"Lo público y el bien común",v:"Tm_T8qoCTGg",
r:["<b>1. ¿Qué es lo público?</b> Cuando decimos «lo público» nos referimos a todo aquello que pertenece a la comunidad y que está al servicio de todas las personas sin distinción: las calles, los andenes, los parques, las plazas, las bibliotecas, los hospitales, las escuelas y colegios oficiales, el alumbrado y hasta las bancas donde nos sentamos a esperar el bus. Lo público no tiene un dueño individual que lo cuide por nosotros; precisamente porque es de todos, el cuidado nos corresponde a todos. Una forma sencilla de entenderlo es compararlo con la casa: nadie dejaría que un desconocido rayara las paredes de su sala, pero muchas personas no sienten lo mismo frente a la pared de un parque, aunque esa pared también sea suya, de sus vecinos y de las generaciones que vendrán.","<b>2. Lo que dice la Constitución sobre los bienes de uso público.</b> La Constitución Política de 1991 (art. 63) establece que los bienes de uso público, como calles, plazas y parques, son inalienables, imprescriptibles e inembargables. Inalienables significa que no se pueden vender; imprescriptibles, que nadie los adquiere por usarlos durante muchos años; inembargables, que no pueden ser embargados para pagar deudas. Piensa en un caso real y frecuente: una familia cierra con rejas una zona de un parque y la usa durante veinte años como parqueadero o jardín propio. Por mucho tiempo que pase, esa familia no se vuelve dueña de ella, porque el tiempo de uso no convierte un bien de todos en un bien privado. La zona sigue siendo de uso público y puede ser recuperada para la comunidad.","<b>3. Bienes de uso público y bienes fiscales.</b> Conviene no confundir dos categorías. Los bienes de uso público son aquellos que usa directamente toda la comunidad: la calle por la que caminas, el parque donde juegas, la plaza donde se hacen las celebraciones del barrio. Los bienes fiscales, en cambio, son los que el Estado posee para que su administración pueda funcionar, por ejemplo el edificio de una oficina estatal. Ambos se pagan con recursos públicos y ambos deben cuidarse, pero se diferencian en la forma en que se usan: los primeros están abiertos al uso directo de todos y los segundos sirven al funcionamiento de las instituciones. Reconocer esta diferencia ayuda a comprender por qué las reglas sobre qué se puede hacer con cada bien no son iguales.","<b>4. El uso común prevalece sobre el interés particular.</b> El artículo 82 de la Constitución dice que el Estado debe velar por la protección de la integridad del espacio público y por su destinación al uso común, el cual prevalece sobre el interés particular. Esto significa que cuando el beneficio de una sola persona choca con el derecho de la comunidad a usar un espacio, debe primar el uso común. Un ejemplo cotidiano: un vendedor ocupa toda la acera frente al colegio. Aunque su necesidad de trabajar merece respeto y soluciones concertadas, si su puesto impide el paso de personas con movilidad reducida, de quienes van en silla de ruedas o de padres que llevan niños pequeños, se vulnera el principio de prevalencia del uso común. La respuesta no es la agresión, sino el diálogo y la intervención de las autoridades competentes.","<b>5. Los deberes de las personas y los ciudadanos.</b> El artículo 95 de la Constitución recuerda que ser ciudadano no solo implica derechos, sino también deberes. El numeral 1 establece el deber de respetar los derechos ajenos y no abusar de los propios; es decir, mi libertad llega hasta donde empieza el derecho de los demás. El numeral 8 establece el deber de proteger los recursos culturales y naturales del país y de velar por la conservación de un ambiente sano. Participar en una jornada de siembra y limpieza del entorno del colegio, cuidar una zona verde o evitar arrojar basura son maneras concretas de cumplir este deber. Los derechos y los deberes son como las dos caras de una moneda: no se puede exigir una sin asumir la otra.","<b>6. El bien común.</b> Con frecuencia se piensa que el bien común es simplemente lo que quiere la mayoría, pero no es así. El bien común es el conjunto de condiciones que permite a todas las personas alcanzar su bienestar. No se trata de favorecer a un grupo influyente ni de sumar caprichos individuales, sino de crear y proteger las condiciones —espacios seguros, servicios, ambiente sano, reglas justas— de las que todas y todos nos beneficiamos. Por eso, cuando alguien daña una banca, un tablero o una llave de agua del colegio, no afecta únicamente a una persona: afecta a quienes la usan hoy y a quienes la usarán mañana, y obliga a gastar tiempo y recursos que podrían servir para otras necesidades de la comunidad.","<b>7. El efecto polizón y otras excusas peligrosas.</b> Un riesgo muy frecuente al hablar de lo público es el llamado efecto polizón: pensar que, como todos usan algo, otro lo cuidará mientras yo lo uso sin aportar nada. Si todos pensamos así, nadie cuida y el bien se deteriora. Otra excusa habitual es decir «si lo daño, el Estado lo repone». Esa frase esconde un error de razonamiento: el dinero para reponer lo dañado sale de recursos públicos, en buena parte de los impuestos que pagamos todas las personas, y ese dinero deja de usarse en otras necesidades, como libros, mantenimiento de salones, programas de alimentación o mejoras en la comunidad. Repararlo no es gratis: alguien lo paga, y somos nosotros mismos.","<b>8. De la reflexión a la práctica.</b> Cuidar lo público empieza por tres hábitos: usar con respeto lo que es de todos, reportar con responsabilidad los daños que veamos y animar con el ejemplo a quienes nos rodean. Pregúntate: ¿qué espacios públicos usas cada semana?, ¿cómo estaban cuando los encontraste?, ¿cómo los dejas tú? Recordar que el colegio y el barrio son de todos, y que su estado refleja la forma en que convivimos, es el primer paso para convertirnos en ciudadanos que protegen el bien común."],
q:[["Un parque fue usado por una familia durante veinte años y la familia sostiene que el tiempo de ocupación le dio derechos de propiedad. ¿Qué concepto del art. 63 contradice directamente esa conclusión?","Inembargabilidad","Imprescriptibilidad","Inalienabilidad","Uso común",1],["Una oficina de una entidad estatal está dentro de un edificio que el Estado posee para desarrollar sus funciones. Según la distinción del curso, ¿qué tipo de bien es?","Bien de uso público","Bien fiscal","Bien privado de interés social","Bien comunitario",1],["Un puesto comercial deja libre una parte de la acera, pero obliga a las personas en silla de ruedas a bajar a la vía. ¿Qué criterio debe orientar la solución?","El interés particular siempre prevalece si existe una actividad económica","El uso común prevalece cuando el interés particular impide el uso comunitario del espacio","La antigüedad del puesto convierte el espacio en privado","El problema solo existe si se demuestra daño material",1],["Un estudiante encuentra una zona común deteriorada y decide no reportarla porque supone que alguien más lo hará. ¿Qué idea del curso describe mejor esa conducta?","Bien fiscal","Efecto polizón","Autorregulación","Interés particular",1],["Una persona afirma: «Puedo exigir mis derechos sin preocuparme por los demás». ¿Qué parte del artículo 95 trabajado en el curso contradice esa idea?","El deber de pagar por todos los servicios públicos","El deber de respetar los derechos ajenos y no abusar de los propios","El deber de ocupar los espacios públicos antes que otros","El deber de evitar únicamente daños ambientales",1],["¿Cuál situación diferencia mejor un bien de uso público de uno fiscal?","Una plaza del barrio está abierta al uso directo de la comunidad, mientras una oficina estatal sirve para el funcionamiento de una entidad","Una oficina estatal puede ser usada libremente por cualquier persona, mientras una plaza solo puede usarla quien viva cerca","Ambos tienen exactamente la misma forma de uso porque los dos pertenecen al Estado","Un parque se convierte en fiscal cuando una entidad pública se encarga de mantenerlo",0],["Un colegio debe gastar dinero para reparar una banca dañada. Según la explicación del curso sobre los recursos públicos, ¿qué consecuencia adicional se debe considerar?","El gasto de reparación no afecta otros servicios porque los recursos públicos son independientes","Los recursos destinados a reparar el daño podrían dejar de estar disponibles para otras necesidades de la comunidad","La reparación convierte automáticamente la banca en un bien fiscal","El daño solo tiene consecuencias para quien rompió la banca",1],["Una persona necesita vender frente al colegio, pero su puesto bloquea totalmente un paso peatonal. ¿Cuál respuesta coincide con el enfoque presentado en el curso?","Ignorar el bloqueo porque la necesidad económica elimina el conflicto","Retirar el puesto por la fuerza entre los estudiantes","Buscar una solución mediante diálogo e intervención de las autoridades competentes","Permitir el bloqueo mientras no exista una denuncia formal",2],["Según el texto, ¿por qué el bien común no puede reducirse simplemente a «lo que quiere la mayoría»?","Porque la mayoría nunca participa en decisiones públicas","Porque busca condiciones de bienestar para todas las personas y no solo favorecer preferencias de un grupo","Porque únicamente las autoridades pueden definir qué es bienestar","Porque el bien común se limita al mantenimiento de edificios públicos",1],["Una jornada escolar combina siembra y limpieza de una zona verde. ¿Qué deber constitucional trabajado en el módulo se relaciona directamente con ambas acciones?","Proteger los recursos culturales y naturales y velar por un ambiente sano","Garantizar que cada estudiante tenga propiedad sobre la zona intervenida","Evitar que otras personas utilicen el espacio después de la jornada","Sustituir las funciones de las autoridades ambientales",0]]},
{t:"Cuidado de la planta física del colegio",v:"wo0m5gVOtVI",
r:["<b>1. Un colegio es una casa compartida.</b> La planta física del colegio incluye las aulas, los pupitres, el tablero, los baños, los patios, la biblioteca, los laboratorios, las zonas verdes, las instalaciones eléctricas y de agua, y los materiales didácticos. Todo esto se paga con recursos de la comunidad y lo usan cientos de personas cada día, por lo que su estado influye directamente en la calidad del aprendizaje, en la seguridad y en el bienestar de quienes estudian y trabajan allí. Un salón limpio, con sillas en buen estado y buena iluminación favorece la concentración; un salón deteriorado, sucio o peligroso desanima y puede provocar accidentes. Cuidar el colegio no es un favor a la institución: es cuidar el lugar donde pasas una parte muy importante de tu vida.","<b>2. La teoría de las ventanas rotas.</b> Un principio muy útil para entender el deterioro de los espacios es el de las «ventanas rotas», propuesto por Wilson y Kelling en 1982. La idea es sencilla: si un edificio tiene una ventana rota y nadie la repara, se comunica el mensaje de que a nadie le importa ese lugar, y pronto aparecen más vidrios rotos, más rayones y más basura. En un colegio ocurre lo mismo: una grieta pequeña en un muro, una llave que gotea o un pupitre rayado que se deja sin atender invitan a más deterioro y descuido. Por eso la reacción oportuna ante un daño pequeño evita problemas mayores y más costosos. Un lugar cuidado, en cambio, invita a seguir cuidándolo.","<b>3. Mantenimiento preventivo y correctivo.</b> Existen dos grandes formas de mantener las instalaciones. El mantenimiento preventivo se hace antes de que ocurra la falla: revisar periódicamente las conexiones eléctricas, lubricar las bisagras de las puertas, pintar para proteger las superficies, limpiar canaletas antes de la temporada de lluvias o reportar una fisura apenas se nota. El mantenimiento correctivo repara lo que ya se dañó: cambiar una puerta rota, arreglar una tubería reventada o reponer un vidrio quebrado. El preventivo suele costar menos y evita daños mayores, mientras que el correctivo suele ser más caro y a veces implica suspender actividades. Una comunidad que se preocupa por prevenir gasta menos y trabaja con más tranquilidad.","<b>4. Cómo reportar un daño de manera útil.</b> Reportar un daño es una forma de cuidar. Pero un reporte vago, como «hay un problema en el salón», sirve poco. Un buen reporte indica qué se dañó, dónde y cuándo se notó, y se entrega al director de grupo o a la coordinación para que quede registrado y se atienda. Por ejemplo: «La llave del lavamanos del baño del segundo piso gotea desde ayer en la tarde». Con esa información, la persona encargada del mantenimiento puede actuar rápido. Además, reportar a tiempo evita que alguien resulte culpado injustamente y permite dar prioridad a lo que representa un riesgo para la seguridad.","<b>5. Hábitos concretos de cuidado en el aula y en los baños.</b> Hay conductas pequeñas que marcan una gran diferencia. No te balancees en sillas sobre dos patas: se debilita la estructura de la silla y aumenta el riesgo de caída y de lesiones. No arrojes toallas higiénicas, papel ni objetos al sanitario, porque obstruyen las tuberías y generan taponamientos costosos de reparar, además de malos olores y problemas de salubridad para todos. Evita rayar mesas, paredes y puertas; si necesitas escribir, usa tus cuadernos. Devuelve los materiales a su lugar, deja el salón ordenado al salir y respeta los espacios de los demás, incluidos los materiales de la biblioteca y del laboratorio.","<b>6. Seguridad: pasillos, salidas y evacuación.</b> Los pasillos, las escaleras y las salidas del colegio son, además de lugares de tránsito, rutas de evacuación. Dejar mochilas, sillas o muebles en esos espacios puede parecer inofensivo, pero en una emergencia, como un sismo o un incendio, bloquear una ruta de evacuación puede poner vidas en riesgo. Por eso nunca se deben obstruir pasillos ni salidas, y los elementos de seguridad, como señales y extintores, no se tocan ni se esconden. Conocer las rutas de evacuación de tu colegio y participar con seriedad en los simulacros es parte de cuidar lo público, porque protege a toda la comunidad.","<b>7. Ahorro de energía y agua.</b> Los servicios del colegio también son bienes que debemos cuidar. Apagar las luces de los salones vacíos y los ventiladores o equipos que no se usan reduce el consumo de energía y el gasto del plantel. Los bombillos LED consumen mucho menos energía que los incandescentes, por lo que cambiarlos es una inversión que se recupera. Con el agua ocurre algo parecido: cerrar bien las llaves y avisar cuando una gotea evita desperdicios. Estos ahorros no solo reducen costos; también disminuyen el impacto ambiental y dejan más recursos para mejorar otras cosas, como materiales o arreglos pendientes.","<b>8. Cuando ocurre un daño accidental.</b> Todas las personas pueden cometer errores: se rompe un vidrio con una pelota, se quiebra una silla, se derrama un líquido sobre el equipo. Lo importante es cómo se responde. Si ocurre un daño accidental, lo responsable es informar con honestidad y participar en la reparación. Ocultarlo o culpar a otra persona agrava el problema, genera desconfianza y puede afectar a compañeros inocentes. Asumir la responsabilidad con sinceridad demuestra madurez y permite que la comunidad resuelva el asunto de manera justa y rápida.","<b>9. Iniciativas de mejora: hacerlo bien y con permiso.</b> Los estudiantes y docentes suelen tener buenas ideas para mejorar el colegio: pintar un mural, sembrar un jardín, organizar una jornada de limpieza. Estas iniciativas son valiosas, pero deben coordinarse con la institución y contar con autorización, para actuar dentro de las normas del plantel y garantizar la seguridad, la calidad de los materiales y el respeto por el diseño del lugar. Pintar un mural sin avisar, aunque la intención sea buena, puede generar conflictos y gastos. Con permiso y organización, en cambio, el esfuerzo del grupo se convierte en un orgullo para todos."],
q:[["Un pupitre presenta una pequeña falla que todavía permite usarlo, pero podría empeorar. Según la teoría de las ventanas rotas y el mantenimiento preventivo, ¿qué actuación resulta coherente?","Esperar hasta que se rompa completamente para justificar una reparación","Reportarlo oportunamente para evitar que el deterioro avance","Ocultarlo para evitar que el salón parezca deteriorado","Cambiarlo por otro pupitre sin informar el problema",1],["¿Cuál situación corresponde específicamente a mantenimiento preventivo?","Reemplazar un vidrio después de que se quebró","Reparar una tubería después de una fuga grande","Limpiar las canaletas antes de la temporada de lluvias","Cambiar una puerta después de que se rompe",2],["Un estudiante escribe «hay un problema en el salón» en el reporte de mantenimiento. ¿Qué elemento importante falta para que el reporte sea útil?","Una explicación de por qué el estudiante cree que ocurrió","Qué se dañó, dónde está y cuándo se notó","El nombre de todos los estudiantes del salón","Una fotografía obligatoria del estudiante que encontró el daño",1],["Una llave del baño gotea desde el día anterior. ¿Cuál reporte reproduce mejor el modelo presentado en la lectura?","«El baño está mal y alguien debería arreglarlo»","«Hay una llave dañada en el colegio»","«La llave del lavamanos del baño del segundo piso gotea desde ayer en la tarde»","«El mantenimiento debe revisar todos los baños cuanto antes»",2],["¿Por qué la teoría de las ventanas rotas se usa en el curso para explicar el cuidado del colegio?","Porque cualquier daño pequeño demuestra que una persona cometió un delito","Porque un daño visible que no se atiende puede comunicar descuido y favorecer que aparezca más deterioro","Porque reparar daños pequeños siempre cuesta más que reparar daños grandes","Porque los espacios deteriorados dejan de pertenecer a la comunidad",1],["Dos estudiantes observan una fisura en un muro. Uno propone esperar a que se vuelva peligrosa y el otro propone reportarla de inmediato. ¿Qué idea del curso respalda la segunda opción?","El mantenimiento correctivo siempre debe hacerse antes que el preventivo","La reacción oportuna ante daños pequeños puede evitar problemas mayores y más costosos","Los estudiantes son responsables de reparar directamente cualquier instalación","Los daños solo deben reportarse cuando ya causan un accidente",1],["Una puerta ya está rota y necesita reparación. ¿Cómo se clasifica principalmente la intervención necesaria?","Preventiva, porque toda reparación previene problemas","Correctiva, porque actúa sobre un daño que ya ocurrió","Preventiva, porque se realiza dentro del colegio","No corresponde a mantenimiento porque las puertas son bienes fiscales",1],["Un estudiante se balancea constantemente en una silla y termina dañándola. ¿Qué principio de cuidado del aula se está incumpliendo?","Usar los elementos del colegio de manera adecuada para evitar deteriorarlos","Aplicar únicamente las normas relacionadas con espacios públicos externos","Dejar los daños sin reportar para no interrumpir las clases","Usar los muebles solo cuando exista supervisión de un docente",0],["¿Por qué un buen reporte puede ayudar también a determinar prioridades?","Porque permite identificar qué daño representa un riesgo para la seguridad","Porque todos los daños deben repararse exactamente en el orden en que fueron reportados","Porque elimina la necesidad de revisar físicamente el lugar","Porque convierte cualquier daño en una emergencia",0],["Un estudiante detecta una fuga pequeña y decide no informar porque «todavía funciona». ¿Qué combinación de ideas del módulo muestra el problema de esa decisión?","Prevención y reacción oportuna ante daños pequeños","Propiedad privada y uso exclusivo","Reciclaje y separación en la fuente","Convivencia y clasificación de situaciones",0]]},
{t:"Residuos, agua y medio ambiente",v:"9_4rT6xFo_M",
r:["<b>1. Por qué los residuos son un asunto público.</b> Cada día, en el colegio y en la casa, producimos residuos: envases, papeles, restos de comida, empaques. Lo que hacemos con ellos no es un asunto privado, porque tiene efectos en los espacios que compartimos: calles limpias o llenas de basura, ríos sanos o contaminados, rellenos sanitarios que duran más o se llenan rápido. Cuidar lo público incluye cuidar el ambiente, y una de las formas más simples y efectivas de hacerlo es separar bien los residuos en el lugar donde se generan, lo que se conoce como separación en la fuente.","<b>2. El código de colores en Colombia.</b> Desde el 1 de enero de 2021, la Resolución 2184 de 2019 del Ministerio de Ambiente unificó en todo el país el código de colores para separar los residuos. La caneca o bolsa blanca es para los residuos aprovechables limpios y secos: plástico, vidrio, metales, papel y cartón. La negra es para los no aprovechables: papel higiénico, servilletas, papeles y cartones contaminados con comida, y también tapabocas y guantes. La verde es para los orgánicos aprovechables: restos de comida y residuos de poda. Antes de esa norma existían otros colores que variaban de ciudad en ciudad; ahora son los mismos en todo el territorio nacional, lo que facilita aprender y practicar la separación.","<b>3. Casos que generan dudas.</b> Algunos residuos confunden. Una caja de pizza con grasa y restos de queso va en la caneca negra, porque la grasa contamina el cartón y lo vuelve inservible para reciclar. Una botella plástica vacía, limpia y seca va en la blanca; si tiene restos de bebida, conviene enjuagarla. Las cáscaras de naranja y los restos de manzana del almuerzo van en la verde. Una servilleta usada va en la negra. La regla general es esta: lo aprovechable debe ir limpio y seco, porque la grasa y los líquidos contaminan el material y lo hacen inservible para reciclar. Un solo residuo sucio puede arruinar material que de otra manera sí se aprovecharía.","<b>4. Residuos peligrosos.</b> No todo se puede arrojar en las canecas comunes. Las pilas agotadas, los tubos fluorescentes, las baterías y otros residuos peligrosos contienen sustancias que pueden contaminar el suelo y el agua y afectar la salud. Por eso deben llevarse a puntos de recolección posconsumo, donde reciben un manejo especial. Si tu colegio tiene un punto de acopio para pilas o tóner, úsalo; si no lo tiene, es una excelente iniciativa para proponer a la comunidad educativa.","<b>5. Las «R» de la economía circular.</b> La economía circular propone repensar la forma en que producimos y consumimos, y entre sus principios están varias «R»: Reducir, Reutilizar y Reciclar, entre otras. Aunque reciclar es muy conocido, la acción más efectiva es Reducir, porque evita generar el residuo desde el principio. Luego viene Reutilizar, es decir, darle un nuevo uso a los objetos, y después Reciclar. Un ejemplo claro: llevar una botella reutilizable en lugar de comprar botellas plásticas cada día es reducir y reutilizar al mismo tiempo. Usar ambas caras de una hoja, reparar un objeto en lugar de botarlo o evitar los empaques innecesarios son prácticas del mismo estilo.","<b>6. El destino de los residuos orgánicos y el compostaje.</b> Los restos de comida y de poda son una parte muy grande de lo que botamos. Si van al relleno sanitario, se descomponen sin oxígeno y producen metano, un gas que contribuye al calentamiento global. El compostaje transforma esos restos orgánicos en abono y evita que generen metano en el relleno. En un colegio con zonas verdes, un pequeño proyecto de compostaje puede producir abono para el jardín y servir como espacio de aprendizaje para toda la comunidad, además de reducir la cantidad de basura que sale de la institución.","<b>7. Los rellenos sanitarios y el cambio que podemos lograr.</b> Los rellenos sanitarios tienen una capacidad limitada. Cada kilo que desviamos al reciclaje o al compostaje es un kilo menos que ocupa espacio y genera emisiones allí. Separar bien alarga la vida útil de los rellenos y reduce emisiones, además de generar oportunidades de trabajo para personas recicladoras, quienes recuperan el material aprovechable y lo reincorporan al ciclo productivo. Cuando separamos mal, no solo contaminamos el material: también dificultamos el trabajo de quienes lo recuperan.","<b>8. El agua: un bien que no podemos desperdiciar.</b> El agua que llega a los baños, lavamanos y bebederos del colegio es un servicio público con un costo ambiental y económico. Una llave que gotea de forma continua puede desperdiciar cientos de litros al mes, sin que nadie lo note. Cerrar bien las llaves, evitar jugar con el agua y reportar las fugas son acciones sencillas que, multiplicadas por cientos de estudiantes, producen un ahorro enorme. Cuidar el agua es cuidar un recurso que comparten las personas, los animales y los ecosistemas de los que dependemos.","<b>9. Basura en la calle: un problema que se devuelve.</b> Cuando la basura se arroja a la calle, el agua de lluvia la arrastra hacia los sumideros y las alcantarillas. Si se acumulan bolsas, envases y papeles, las alcantarillas se tapan y aumenta el riesgo de inundaciones, que afectan viviendas, vías y comercios. Además, los residuos terminan en quebradas y ríos, donde dañan la vida acuática. Arrojar un envase al suelo parece un gesto mínimo, pero repetido por muchas personas se convierte en un problema grave que termina afectando a quienes lo causaron.","<b>10. Acciones para el colegio.</b> Algunas ideas prácticas: organizar un punto ecológico con las tres canecas bien identificadas, hacer campañas de limpieza y de separación, sembrar y cuidar plantas, llevar botellas reutilizables, entregar pilas a puntos de recolección posconsumo y vigilar que las llaves estén cerradas. Cada acción cuenta, y el ejemplo de unos pocos suele convencer a muchos."],
q:[["Una botella plástica contiene todavía parte de una bebida. Antes de decidir en qué recipiente depositarla, ¿qué criterio del curso resulta determinante?","Que el plástico siempre pertenece a la caneca blanca sin importar su estado","Que los aprovechables deben estar limpios y secos","Que todo residuo de bebidas debe ir a la caneca verde","Que los envases usados siempre son residuos no aprovechables",1],["Un estudiante encuentra una caja de pizza con grasa y restos de queso. ¿Por qué no debe tratarla igual que un cartón limpio?","Porque el cartón contaminado con comida corresponde a los no aprovechables","Porque todo residuo de comida debe ir a la caneca blanca","Porque las cajas de pizza son residuos peligrosos","Porque el papel y el cartón solo se pueden reciclar fuera del colegio",0],["Durante el almuerzo quedan cáscaras de naranja y restos de manzana. Según el código trabajado, ¿qué característica tienen esos residuos?","Son aprovechables limpios y secos de la caneca blanca","Son no aprovechables de la caneca negra","Son orgánicos aprovechables de la caneca verde","Son residuos peligrosos de manejo especial",2],["Una servilleta usada y una hoja de papel limpia aparecen juntas después de una actividad. ¿Qué diferencia explica su separación?","La servilleta usada va a la negra porque está contaminada; la hoja limpia puede ir a la blanca","Ambas van a la blanca porque siguen siendo productos de papel","Ambas van a la negra porque todo papel usado es no aprovechable","La hoja va a la verde y la servilleta a la blanca",0],["¿Qué cambio introdujo la Resolución 2184 de 2019 según la lectura?","Eliminó la separación de residuos en los colegios","Unificó en Colombia el código de colores para separar residuos desde el 1 de enero de 2021","Estableció que todos los residuos deben ir a una sola caneca","Permitió que cada municipio escogiera nuevamente sus colores",1],["Una pila agotada aparece en el salón. ¿Por qué el curso indica que no debe depositarse simplemente en una caneca común?","Porque las pilas son residuos orgánicos que necesitan compostaje","Porque contienen sustancias que pueden contaminar y requieren manejo especial en puntos de recolección posconsumo","Porque las pilas solo pueden almacenarse dentro de las aulas","Porque todas las pilas pueden reciclarse junto con papel y cartón",1],["Un estudiante propone comprar una botella plástica nueva todos los días y luego depositarla correctamente. Frente a la secuencia de las «R», ¿qué alternativa representa mejor el principio explicado?","Comprar más botellas para aumentar el material reciclable","Llevar una botella reutilizable para evitar generar diariamente el mismo residuo","Desechar las botellas en la caneca negra para reducir el trabajo de separación","Usar una botella nueva y compartirla solo cuando alguien la solicite",1],["¿Por qué separar correctamente en el lugar donde se genera el residuo es importante según el módulo?","Porque evita que todos los residuos tengan que ser transportados","Porque facilita el aprovechamiento y evita que materiales recuperables se contaminen","Porque convierte automáticamente cualquier residuo en reciclable","Porque elimina la necesidad de puntos de recolección especiales",1],["Un cartón limpio termina mezclado con una servilleta usada. ¿Qué problema señalado en el curso puede producirse?","El cartón puede contaminarse y dejar de ser aprovechable","La servilleta puede convertirse en residuo peligroso","El cartón pasa automáticamente a la categoría de orgánico","Ambos residuos conservan exactamente la misma posibilidad de aprovechamiento",0],["Una comunidad educativa quiere reducir los residuos desde su origen. ¿Cuál de las acciones refleja mejor el orden de prioridad explicado en las «R»?","Generar el residuo, reutilizarlo y después intentar reducirlo","Reducir la generación, reutilizar objetos y posteriormente reciclar cuando corresponda","Reciclar primero y solo reducir cuando no exista un contenedor","Desechar rápidamente y reemplazar los objetos por otros nuevos",1]]},
{t:"Convivencia escolar y responsabilidad",v:"Jxn2Vj7GrSw",
r:["<b>1. Convivir también es cuidar lo público.</b> La convivencia es la capacidad de vivir juntos respetando las diferencias. En el colegio, convivir bien significa que todas las personas se sientan seguras, escuchadas y respetadas, y que los espacios y bienes comunes se cuiden entre todos. Un colegio donde hay agresiones, burlas o irrespeto es también un colegio donde se descuidan los espacios, porque la falta de respeto por las personas suele ir acompañada de la falta de respeto por las cosas. Por eso la convivencia y el cuidado de los bienes públicos están muy relacionados.","<b>2. El marco legal: la Ley 1620 de 2013.</b> En Colombia, la Ley 1620 de 2013 creó el Sistema Nacional de Convivencia Escolar y Formación para el Ejercicio de los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. Su propósito es contribuir a formar ciudadanos activos que participen en la vida escolar y prevengan y atiendan la violencia. La Ley se desarrolla mediante el Decreto 1965 de 2013, que explica cómo deben actuar los establecimientos educativos y qué procedimientos seguir cuando ocurren situaciones que afectan la convivencia.","<b>3. El Comité Escolar de Convivencia.</b> En cada institución funciona un Comité Escolar de Convivencia, presidido por el rector. Este comité se encarga de promover la convivencia, atender los casos que se presenten y hacer seguimiento a las situaciones. Está conformado por representantes de distintos sectores de la comunidad educativa, como la coordinación, el personero estudiantil, el docente orientador, los consejos de padres y de estudiantes, y un docente que lidere procesos de convivencia. Su existencia garantiza que los casos se manejen de manera organizada y con participación.","<b>4. La Ruta de Atención Integral.</b> La Ruta de Atención Integral para la Convivencia Escolar tiene cuatro componentes: promoción, prevención, atención y seguimiento. La promoción busca fortalecer valores y prácticas positivas; la prevención, anticiparse a los riesgos; la atención, responder a las situaciones que ya ocurrieron; y el seguimiento, verificar que los casos se resuelvan y que no se repitan. Una convivencia sana no se logra solo castigando, sino trabajando en los cuatro componentes de manera permanente.","<b>5. Los tres tipos de situaciones.</b> Las situaciones que afectan la convivencia se clasifican en tres tipos. Las de Tipo I son conflictos manejados inadecuadamente y situaciones esporádicas que afectan el clima escolar, sin causar daño al cuerpo o la salud; por ejemplo, dos estudiantes que discuten a gritos por un cuaderno. Las de Tipo II son agresión escolar, acoso escolar (bullying) y ciberacoso que no son delito, pero se presentan de manera repetida o sistemática y causan daños; por ejemplo, burlas repetidas durante semanas a un compañero. Las de Tipo III son situaciones que constituyen presuntos delitos, como los atentados contra la libertad, integridad y formación sexual; en ellas se activa la ruta con las autoridades competentes. Conocer esta clasificación permite saber cómo actuar en cada caso.","<b>6. Conflicto no es lo mismo que agresión.</b> Un conflicto es una diferencia natural de intereses o puntos de vista. Aparece en cualquier grupo humano y no tiene por qué ser negativo si se maneja bien: puede resolverse con diálogo, escucha y mediación, y hasta puede mejorar las relaciones. La agresión, en cambio, busca hacer daño. Confundir las dos cosas lleva a errores: tratar un conflicto como si fuera una agresión puede escalarlo, y tratar una agresión como un simple «conflicto entre las partes» puede dejar sin protección a quien la sufre, que no está en una situación de igualdad frente a quien le hace daño.","<b>7. El manual de convivencia.</b> El manual de convivencia reúne los derechos, los deberes y los procedimientos de la comunidad educativa. Debe construirse con participación de toda la comunidad educativa, es decir, estudiantes, docentes, familias y directivos, para que sea legítimo y lo asuma todo el mundo. Una norma que se conoce, que se comprende y en cuya construcción se participó se cumple con más convicción que una impuesta desde afuera. Conocer el manual de tu colegio y proponer mejoras es una forma de ejercer ciudadanía.","<b>8. El debido proceso.</b> Cuando una persona es señalada por una falta, el debido proceso garantiza el derecho a ser escuchada y a defenderse antes de que se tome una decisión. Esto significa conocer lo que se le atribuye, poder dar su versión, presentar pruebas y que la decisión sea proporcional y esté fundamentada en las normas. Sancionar sin escuchar es injusto y no enseña nada; en cambio, un proceso justo enseña que las decisiones se toman con razones y que todos somos tratados con dignidad.","<b>9. Reparar en lugar de humillar.</b> Un enfoque muy valioso es el restaurativo. Si un estudiante daña un pupitre, humillarlo en público o expulsarlo no arregla el pupitre ni enseña a cuidar. La respuesta restaurativa busca que reconozca el daño, lo repare (o aporte a su arreglo) y reflexione sobre su efecto en la comunidad. Así, la persona asume su responsabilidad, la comunidad recupera lo que perdió y se fortalece la confianza. Reparar es una forma de responsabilidad, no de debilidad.","<b>10. Tu papel en la convivencia.</b> Docentes y directivos deben dar ejemplo, pero los estudiantes también pueden promover el cuidado con campañas y buen ejemplo entre compañeros. Hablar con respeto, no participar en burlas, pedir ayuda cuando alguien sufre agresiones, cuidar los bienes del colegio y proponer soluciones son formas de construir un entorno más justo y seguro."],
q:[["Dos estudiantes tienen una discusión puntual por un cuaderno y terminan gritando, pero no hay daño físico ni se trata de una conducta repetida. ¿Qué clasificación corresponde al ejemplo del curso?","Tipo I","Tipo II","Tipo III","No puede considerarse una situación de convivencia",0],["Un estudiante recibe burlas durante varias semanas y la conducta repetida le causa afectaciones. Según la clasificación presentada, ¿qué elemento permite diferenciar este caso del Tipo I?","Que ocurre dentro de un aula","La repetición o sistematicidad y el daño causado","Que participan exactamente dos estudiantes","Que no existe ningún conflicto entre las personas",1],["Una situación de convivencia presenta características que constituyen un presunto delito. ¿Qué clasificación debe considerarse según el módulo?","Tipo I","Tipo II","Tipo III","Promoción",2],["¿Cuál es la relación correcta entre los componentes de la Ruta de Atención Integral?","Promoción anticipa riesgos, prevención fortalece valores, atención evita registrar casos y seguimiento sanciona","Promoción fortalece prácticas positivas, prevención anticipa riesgos, atención responde a situaciones ocurridas y seguimiento verifica su evolución","Promoción atiende casos, prevención castiga conductas, atención realiza campañas y seguimiento reemplaza al comité","Los cuatro componentes cumplen exactamente la misma función",1],["Una institución realiza actividades para fortalecer el respeto antes de que aparezca un conflicto. ¿Qué componente de la Ruta está aplicando principalmente?","Atención","Seguimiento","Promoción","Clasificación",2],["Después de atender una situación, el colegio revisa si las medidas funcionaron y si el problema volvió a ocurrir. ¿Qué componente corresponde?","Promoción","Prevención","Atención","Seguimiento",3],["Según la composición descrita en el curso, ¿qué característica distingue al Comité Escolar de Convivencia?","Está integrado únicamente por estudiantes afectados por conflictos","Reúne representantes de distintos sectores de la comunidad educativa y es presidido por el rector","Está compuesto exclusivamente por docentes y personal administrativo","Solo participa cuando una situación ya constituye un delito",1],["¿Qué relación establece el módulo entre convivencia y cuidado de los bienes comunes?","Son asuntos independientes porque una trata de personas y la otra de objetos","La falta de respeto por las personas puede estar relacionada con la falta de respeto por los espacios y bienes compartidos","El cuidado de los bienes reemplaza la necesidad de resolver conflictos","La convivencia solo afecta las relaciones personales, nunca los espacios",1],["¿Qué propósito general atribuye el curso a la Ley 1620 de 2013?","Regular únicamente el mantenimiento de la infraestructura escolar","Crear un sistema para promover la convivencia escolar, formar para los derechos y prevenir y atender la violencia escolar","Establecer el código de colores de residuos en las instituciones","Definir exclusivamente las sanciones económicas para estudiantes",1],["Un colegio decide trabajar únicamente después de que ocurren conflictos y no realiza acciones de promoción, prevención ni seguimiento. ¿Qué aspecto de la Ruta estaría ignorando?","Que la convivencia se trabaja mediante cuatro componentes y no solo mediante la respuesta a casos ocurridos","Que todos los conflictos deben convertirse en situaciones Tipo III","Que el Comité Escolar de Convivencia solo puede actuar preventivamente","Que la atención está prohibida cuando no existe una actividad de promoción",0]]},
{t:"Ciudadanía y espacios públicos",v:"O6hKinoAvEw",
r:["<b>1. De la clase a la ciudad.</b> Lo que aprendemos en el colegio sobre el cuidado de lo público no está pensado para quedarse dentro de sus muros. Las mismas actitudes que se practican en el salón se ponen a prueba en la calle, en el transporte público, en el parque, en el barrio y en las plataformas digitales. Un ciudadano que cuida el pupitre pero rompe una banca del parque, o que respeta las normas dentro del colegio pero arroja basura apenas sale, no ha interiorizado realmente lo que aprendió. En este módulo ampliamos la mirada: de la comunidad escolar a toda la ciudad.","<b>2. ¿Qué es la cultura ciudadana?</b> La cultura ciudadana es el conjunto de costumbres, acciones y reglas mínimas compartidas que generan sentido de pertenencia, facilitan la convivencia y conducen al respeto del patrimonio común. No consiste solo en conocer las leyes, sino en incorporar hábitos de respeto, cooperación y responsabilidad en la vida diaria: ceder el puesto, hacer fila, no arrojar basura, respetar las señales de tránsito, cuidar el espacio de todos. Cuando la cultura ciudadana es fuerte, la ciudad es más segura, más limpia y más agradable para todos.","<b>3. Ley, moral y cultura.</b> El filósofo y exalcalde de Bogotá Antanas Mockus planteó que el comportamiento de las personas se regula por tres sistemas: la ley, la moral y la cultura. La ley es lo que está permitido o prohibido y se hace cumplir con sanciones. La moral es lo que cada persona considera correcto según su conciencia. La cultura es lo que el grupo social aprueba o rechaza, y se expresa en la presión de la comunidad: la admiración o el reproche de los demás. El reto de una sociedad es armonizar los tres sistemas, de modo que lo legal sea también moralmente aceptado y culturalmente valorado. Cuando hay armonía, cumplir las normas deja de sentirse como una carga.","<b>4. El Código de Policía.</b> La Ley 1801 de 2016, Código Nacional de Seguridad y Convivencia Ciudadana (conocido como Código de Policía), define los comportamientos contrarios a la convivencia y establece medidas correctivas, que pueden incluir multas y la participación en programas comunitarios o actividades pedagógicas de convivencia. Dañar bienes de uso público, ensuciar espacios comunes o alterar la convivencia son comportamientos que pueden dar lugar a esas medidas. Conocer esta norma ayuda a entender que cuidar lo público no es solo una sugerencia amable, sino una obligación con consecuencias.","<b>5. Herramientas de participación: las veedurías.</b> La ciudadanía no solo debe cumplir normas; también puede vigilar cómo se usan los recursos y bienes públicos. Las veedurías ciudadanas, reguladas por la Ley 850 de 2003, son un mecanismo democrático para vigilar la gestión pública y el uso de recursos y bienes públicos. Mediante ellas, un grupo de personas puede hacer seguimiento a obras, proyectos y programas, por ejemplo la construcción o adecuación de un parque o de un colegio, y verificar que se cumplan los objetivos y que los recursos se usen correctamente.","<b>6. El derecho de petición.</b> El artículo 23 de la Constitución consagra el derecho de petición, que permite a cualquier persona presentar solicitudes respetuosas a las autoridades y recibir respuesta. Sirve para pedir información, expresar inquietudes o reportar problemas, como una luminaria dañada, un hueco en la vía o un daño en un espacio público. No se necesita ser abogado ni tener cierta edad para ejercerlo: es un derecho de todas las personas, y es una de las herramientas más sencillas y poderosas para participar en la vida pública.","<b>7. Qué hacer ante situaciones de riesgo.</b> A veces el daño en un espacio público representa un peligro inmediato. Ante un cable caído, por ejemplo, no se toca ni se intenta moverlo: se aleja a las personas del lugar y se avisa de inmediato a la línea de emergencias 123. La prioridad es siempre la vida y la integridad de las personas. Esperar a que alguien más lo reporte, o publicar el hecho en redes sin avisar a las autoridades, puede dejar el peligro sin atender durante horas. Saber a quién llamar y actuar con rapidez y calma es parte de la ciudadanía responsable.","<b>8. Cuando alguien daña lo público.</b> Si ves a alguien dañando un bien público, por ejemplo, un adulto que pinta un grafiti sin permiso en un puente, la respuesta adecuada es reportarlo por canales oficiales, como la alcaldía o la línea de emergencias cuando corresponda, no enfrentarlo con violencia. Responder con agresión puede poner en riesgo tu seguridad y empeorar la situación. Tampoco se trata de ignorar o de unirse: se trata de actuar con prudencia y de usar los mecanismos que la sociedad ha creado para proteger lo que es de todos.","<b>9. Usar bien lo público.</b> Cuidar lo público también es una forma de usarlo. Usar el parque y dejarlo limpio y libre para quien llega después es coherente con la prevalencia del uso común. En el transporte público se cede el puesto a quien más lo necesita, se evita ocupar varios asientos y se cuidan los elementos del vehículo. Se respetan las ciclorrutas, los andenes y los pasos peatonales, y no se bloquean con vehículos, puestos o motos. Cada gesto de respeto multiplica el bienestar colectivo.","<b>10. La autorregulación: el verdadero indicador.</b> El mayor indicador de ciudadanía es la autorregulación: cumplir la norma por convicción, aunque nadie esté mirando. Quien cumple solo cuando hay cámaras, agentes o sanciones no ha asumido realmente el valor del cuidado de lo público. En cambio, quien cuida un parque aunque esté solo, o devuelve un objeto que no se rompió por su culpa, demuestra que ha hecho suyas las normas. Ese es el objetivo final de este curso: que cuidar lo público deje de ser una obligación externa y se convierta en una forma de ser."],
q:[["Un estudiante respeta el pupitre del colegio, pero al salir rompe una banca del parque. Según el primer apartado del módulo, ¿qué demuestra esa conducta?","Que el cuidado de lo público solo se aplica dentro de instituciones educativas","Que conoce las normas escolares, pero no ha interiorizado de manera coherente el cuidado de lo público","Que el parque es un bien privado y por eso no aplica la misma responsabilidad","Que las normas escolares tienen prioridad sobre las ciudadanas",1],["Una persona hace fila, cede el puesto cuando corresponde y respeta señales de tránsito incluso cuando nadie se lo exige. ¿Qué idea del módulo reúne mejor esas conductas?","Cultura ciudadana","Mantenimiento correctivo","Bien fiscal","Veeduría ciudadana",0],["Según la explicación de Mockus incluida en el curso, una persona evita una conducta porque la comunidad la desaprueba. ¿Qué sistema está operando principalmente?","La ley","La moral","La cultura","El derecho de petición",2],["Una persona considera incorrecto hacer algo aunque no exista una sanción y decide no hacerlo por convicción personal. ¿Qué sistema describe principalmente esa motivación?","La cultura","La moral","La ley","El Código de Policía",1],["¿Qué situación representa mejor una diferencia entre ley y cultura según la explicación del módulo?","La ley se relaciona con permitido/prohibido y sanciones, mientras la cultura incluye aprobación o reproche del grupo","La ley depende exclusivamente de la opinión de los vecinos y la cultura de los jueces","La ley y la cultura son exactamente el mismo mecanismo con nombres distintos","La cultura establece multas y la ley determina únicamente costumbres",0],["Un grupo de vecinos quiere vigilar cómo se ejecuta la adecuación de un parque financiada con recursos públicos. ¿Qué mecanismo descrito en el curso corresponde a ese objetivo?","Derecho de petición","Veeduría ciudadana","Comité Escolar de Convivencia","Autorregulación",1],["Una persona quiere informar formalmente a una autoridad sobre una luminaria dañada y solicitar respuesta. ¿Qué herramienta del curso corresponde?","Veeduría ciudadana","Derecho de petición","Código de Policía","Ley 850 de 2003",1],["Una persona daña un bien de uso público y además altera la convivencia. Según el módulo, ¿qué puede establecer la Ley 1801 de 2016 para comportamientos contrarios a la convivencia?","Únicamente una disculpa privada ante los vecinos","Medidas correctivas que pueden incluir multas o actividades pedagógicas y comunitarias","La pérdida automática de todos sus derechos ciudadanos","Una condena penal en todos los casos",1],["Un cable cae en una acera y existe riesgo inmediato para quienes pasan. ¿Cuál secuencia coincide con el procedimiento explicado?","Tocar el cable para comprobar si tiene corriente y después publicar una foto","Alejar a las personas del peligro y avisar de inmediato a la línea 123","Esperar a que alguien más lo reporte para no intervenir","Mover el cable con un objeto para despejar el paso",1],["Una persona cumple una norma únicamente cuando hay cámaras o agentes cerca. ¿Qué concepto del módulo permite identificar la diferencia con la conducta esperada?","Autorregulación, porque esta implica cumplir por convicción aunque nadie esté mirando","Veeduría, porque obliga a todos a vigilar a los demás","Interés particular, porque toda norma depende del beneficio individual","Uso común, porque solo se aplica a parques y calles",0]]}
];
const PASS=8,KEY="curso_publico_v2";
let S={u:null,p:{}},cur=null,role="";
try{const x=localStorage.getItem(KEY);if(x)S=JSON.parse(x)}catch(e){}
S.p=S.p||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const first=n=>n.split(" ")[0];
const done=()=>M.every((_,i)=>S.p[i]!==undefined);
const unlocked=i=>i===0||S.p[i-1]!==undefined;


function topbar(){
 $("top").innerHTML=`<div class="tb"><b>🌱 Cuidado de lo público</b><span class="sp"></span>${S.u&&cur===null?`<span class="who">${esc(first(S.u.n))} · ${esc(S.u.r)}</span>`:""}</div>`;
}
function view(){topbar();if(!S.u)reg();else if(cur===null)home();else mod(cur)}

function reg(){
 app.innerHTML=`<div class="hero"><h1>Cuidado de lo público y del colegio</h1><p>Aprende a cuidar lo que es de todos: el colegio, el barrio y la ciudad.</p><span class="chip">📚 5 módulos</span><span class="chip">🎓 Certificado en PDF</span></div>
 <div class="card"><h2>Regístrate para comenzar</h2><p class="mu">En cada módulo verás un video, leerás un texto y presentarás una evaluación de 10 preguntas. Necesitas acertar al menos 8 para avanzar.</p>
 <label class="f" for="n">Nombres y apellidos</label><input class="t" id="n" autocomplete="name" placeholder="Ej. María Pérez Gómez">
 <label class="f" for="d">Número de documento</label><input class="t" id="d" inputmode="numeric" placeholder="Sin puntos ni espacios">
 <label class="f">¿Eres docente o estudiante?</label><div class="seg" id="seg"><button type="button" data-r="Estudiante">🎒 Estudiante</button><button type="button" data-r="Docente">🍎 Docente</button></div>
 <p id="e" class="res ko"></p><button class="btn" id="go">Comenzar curso →</button></div>`;
 document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b))});
 $("go").onclick=()=>{const n=$("n").value.trim(),d=$("d").value.trim();
  if(n.length<5||!/\s/.test(n)||d.length<5||!role){$("e").textContent="Completa nombres y apellidos, documento (mínimo 5 dígitos) y elige tu rol.";return}
  S={u:{n,d,r:role},p:{}};save();view()};
}

function home(){
 const k=Object.keys(S.p).length,C=2*Math.PI*34;
 app.innerHTML=`<div class="hero hr"><svg width="86" height="86" viewBox="0 0 86 86" aria-hidden="true"><circle cx="43" cy="43" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle cx="43" cy="43" r="34" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-k/5)}" transform="rotate(-90 43 43)"/><text x="43" y="49" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">${k}/5</text></svg>
 <div><h1>Hola, ${esc(first(S.u.n))} 👋</h1><p>${k} de 5 módulos aprobados</p></div></div>
 ${done()?`<div class="card done"><h2>🎓 ¡Felicitaciones, aprobaste el curso!</h2><p>Completaste los 5 módulos. Ya puedes descargar tu certificado.</p><button class="btn" id="cert">Descargar certificado (PDF)</button><p id="ce" class="sm"></p></div>`:""}
 <h2 class="sec">Módulos del curso</h2>
 ${M.map((m,i)=>{const ok=S.p[i]!==undefined,lock=!unlocked(i);
 return `<div class="card mc ${lock?"lock":""}"><span class="num ${ok?"ok":""}">${ok?"✓":lock?"🔒":i+1}</span>
 <div><b>${m.t}</b><div class="mu">${ok?"Aprobado con "+S.p[i]+"/10":lock?"Aprueba el módulo anterior para desbloquear":"Disponible"}</div>
 <div class="mu sm">🎬 video · 📖 lectura · ✍️ 10 preguntas</div></div>
 <button class="btn go" data-i="${i}" ${lock?"disabled":""}>${ok?"Repasar":"Entrar"}</button></div>`}).join("")}
 <button class="ghost" id="out">Cerrar sesión y borrar mi registro</button>`;
 document.querySelectorAll(".go").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;view();scrollTo(0,0)});
 $("out").onclick=()=>{if(confirm("Se borrará tu registro y progreso en este dispositivo. ¿Continuar?")){S={u:null,p:{}};save();cur=null;role="";view()}};
 if($("cert"))$("cert").onclick=cert;
}

function mod(i){
 const m=M[i];
 app.innerHTML=`<button class="ghost" id="back">← Volver al curso</button>
 <div class="mh"><span class="num">${i+1}</span><div><div class="mu">Módulo ${i+1} de 5</div><h1>${m.t}</h1></div></div>
 <nav class="steps"><button data-s="s1">1 · Video</button><button data-s="s2">2 · Lectura</button><button data-s="quizcard">3 · Evaluación</button></nav>
 <section class="card" id="s1"><h2>🎬 Video</h2><p class="mu">Ve el video completo en YouTube y regresa a esta pantalla antes de presentar la evaluación.</p>
 <a class="vcard" href="https://www.youtube.com/watch?v=${m.v}" target="_blank" rel="noopener"><span class="play">▶</span><span><b>Ir al video en YouTube</b><br><small>Se abre en una pestaña nueva</small></span></a></section>
 <section class="card" id="s2"><h2>📖 Lectura</h2><div class="read">${m.r.map(p=>`<p>${p}</p>`).join("")}</div></section>  <section class="card" id="quizcard"></section>`;
 $("back").onclick=()=>{save();cur=null;view()};
 document.querySelectorAll(".steps button").forEach(b=>b.onclick=()=>$(b.dataset.s).scrollIntoView({behavior:"smooth"}));
 buildQuiz(cur);
}

function buildQuiz(i){
 const m=M[i],c=$("quizcard");
 const items=sh(m.q).map(q=>({q:q[0],o:sh([0,1,2,3].map(k=>({t:q[k+1],ok:k===q[5]})))}));
 c.innerHTML=`<h2>✍️ Evaluación</h2><p class="mu">10 preguntas · necesitas mínimo 8 correctas (80%). Las alternativas son deliberadamente parecidas y se mezclan en cada intento.</p><div class="bar"><i id="qb"></i></div><p class="mu sm" id="qc">Respondidas 0 de 10</p><div id="qs"></div><div id="msg"></div><button class="btn" id="sub">Enviar respuestas</button>`;
 $("qs").innerHTML=items.map((it,j)=>`<div class="q" id="q${j}"><p><span class="qn">${j+1}</span><span>${it.q}</span></p>${it.o.map((o,k)=>`<label class="op"><input type="radio" name="q${j}" value="${k}"><i>${"ABCD"[k]}</i><span>${o.t}</span></label>`).join("")}</div>`).join("");
 $("qs").onchange=()=>{let n=0;items.forEach((_,j)=>{const a=document.querySelector(`input[name=q${j}]:checked`);if(a)n++;$("q"+j).querySelectorAll(".op").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked))});$("qc").textContent=`Respondidas ${n} de 10`;$("qb").style.width=n*10+"%"};
 $("sub").onclick=()=>{
  const ans=items.map((it,j)=>document.querySelector(`input[name=q${j}]:checked`));
  const miss=ans.filter(a=>!a).length;
  if(miss){$("msg").innerHTML=`<p class="res ko">Te faltan ${miss} pregunta(s) por responder.</p>`;return}
  const ok=ans.filter((a,j)=>items[j].o[+a.value].ok).length,pass=ok>=PASS;
  if(pass){
   ans.forEach((a,j)=>{$("q"+j).className="q "+(items[j].o[+a.value].ok?"ok":"ko")});
   if(S.p[i]===undefined||ok>S.p[i])S.p[i]=ok;save();
   $("msg").innerHTML=`<div class="score ok"><b>${ok}/10</b><span>¡Aprobado! Obtuviste el ${ok*10}%. Las preguntas marcadas con ✗ son las que fallaste.</span></div>`;$("sub").style.display="none";
   $("msg").insertAdjacentHTML("afterend",`<button class="btn" id="nx">${i<4?"Ir al siguiente módulo →":"Ver mi certificado →"}</button>`);
   $("nx").onclick=()=>{cur=i<4?i+1:null;view();scrollTo(0,0)};
  }else{
   $("msg").innerHTML=`<div class="score ko"><b>${ok}/10</b><span>Obtuviste el ${ok*10}%. Necesitas 8 o más para aprobar. Repasa el video y la lectura e inténtalo de nuevo.</span></div>`;
   $("sub").textContent="Reintentar con preguntas nuevas en otro orden";$("sub").onclick=()=>{buildQuiz(i);c.scrollIntoView({behavior:"smooth"})};
  }
  $("msg").scrollIntoView({behavior:"smooth",block:"center"});
 };
}

async function cert(){
 const ce=$("ce");
 if(!window.jspdf){ce.textContent="No se pudo cargar el generador de PDF. Revisa tu conexión.";return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
 const C=148.5,avg=(Object.values(S.p).reduce((a,b)=>a+b,0)/5*10).toFixed(0);
 doc.setDrawColor(47,125,79);doc.setLineWidth(2);doc.rect(8,8,281,194);doc.setLineWidth(.5);doc.rect(13,13,271,184);
 doc.setTextColor(47,125,79);doc.setFont("helvetica","bold");doc.setFontSize(34);doc.text("CERTIFICADO DE APROBACIÓN",C,48,{align:"center"});
 doc.setTextColor(60,60,60);doc.setFont("helvetica","normal");doc.setFontSize(15);doc.text("Se certifica que",C,72,{align:"center"});
 doc.setFont("helvetica","bold");doc.setFontSize(28);doc.setTextColor(20,20,20);doc.text(S.u.n.toUpperCase(),C,92,{align:"center",maxWidth:250});
 doc.setFont("helvetica","normal");doc.setFontSize(14);doc.setTextColor(60,60,60);
 doc.text(`identificado(a) con documento No. ${S.u.d}, en calidad de ${S.u.r.toUpperCase()},`,C,108,{align:"center"});
 doc.text("aprobó satisfactoriamente los 5 módulos del curso",C,120,{align:"center"});
 doc.setFont("helvetica","bold");doc.setFontSize(22);doc.setTextColor(47,125,79);doc.text("CUIDADO DE LO PÚBLICO Y DEL COLEGIO",C,138,{align:"center"});
 doc.setFont("helvetica","normal");doc.setFontSize(12);doc.setTextColor(60,60,60);
 doc.text(`Promedio de evaluaciones: ${avg}%`,C,154,{align:"center"});
 doc.text("Fecha de expedición: "+new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}),C,166,{align:"center"});
 doc.setDrawColor(100,100,100);doc.setLineWidth(.4);doc.line(C-45,184,C+45,184);doc.setFontSize(10);doc.text("Coordinación del curso",C,189,{align:"center"});
 const name="Certificado_"+S.u.n.replace(/[^A-Za-z0-9]+/g,"_")+".pdf";
 try{
  const dl=window.claude&&await claude.use("downloads");
  if(dl){await dl.save({filename:name,data:doc.output("blob")});ce.textContent="Certificado listo."}
  else{doc.save(name);ce.textContent="Certificado generado."}
 }catch(e){ce.textContent=e&&e.code==="declined"?"Descarga cancelada. Puedes intentarlo de nuevo.":"No se pudo guardar el certificado. Inténtalo de nuevo."}
}
view();
</script>
